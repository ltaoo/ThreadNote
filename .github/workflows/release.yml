name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: ThreadNote
  VELO_VERSION: v1.0.1
  WEBVIEW2_VERSION: 1.0.2792.45

jobs:
  test:
    name: Test and validate tag
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate release version
        id: version
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like v1.2.3 or v1.2.3-beta.1" >&2
            exit 1
          fi
          echo "value=${GITHUB_REF_NAME#v}" >> "${GITHUB_OUTPUT}"

      - name: Run tests
        run: go test ./...

  macos:
    name: macOS
    needs: test
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.test.outputs.version }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      MAC_CERT_IDENTITY: ${{ secrets.MAC_CERT_IDENTITY }}
      MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
      MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install packaging tools
        shell: bash
        run: |
          brew install create-dmg
          go install "github.com/ltaoo/velo/cmd/velo@${VELO_VERSION}"
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"

      - name: Set application version
        shell: bash
        run: |
          config_file="$(mktemp)"
          jq --arg version "${VERSION}" '.app.version = $version' velo.json > "${config_file}"
          mv "${config_file}" velo.json

      - name: Configure signing and notarization
        if: ${{ env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.MAC_CERT_IDENTITY != '' && env.MAC_CERT_P12_BASE64 != '' && env.MAC_CERT_PASSWORD != '' && env.APPLE_API_KEY_P8_BASE64 != '' && env.APPLE_API_KEY_ID != '' && env.APPLE_API_ISSUER_ID != '' }}
        shell: bash
        run: |
          certificate_file="${RUNNER_TEMP}/threadnote-certificate.p12"
          api_key_file="${RUNNER_TEMP}/threadnote-notary-key.p8"
          printf '%s' "${MAC_CERT_P12_BASE64}" | base64 --decode > "${certificate_file}"
          printf '%s' "${APPLE_API_KEY_P8_BASE64}" | base64 --decode > "${api_key_file}"
          {
            printf 'APPLE_ID=%s\n' "${APPLE_ID}"
            printf 'TEAM_ID=%s\n' "${APPLE_TEAM_ID}"
            printf 'MAC_CERT_IDENTITY=%s\n' "${MAC_CERT_IDENTITY}"
            printf 'P12_FILE=%s\n' "${certificate_file}"
            printf 'P12_PASSWORD=%s\n' "${MAC_CERT_PASSWORD}"
            printf 'P8_FILE=%s\n' "${api_key_file}"
            printf 'API_KEY_ID=%s\n' "${APPLE_API_KEY_ID}"
            printf 'API_KEY_ISSUER_ID=%s\n' "${APPLE_API_ISSUER_ID}"
          } > .env

      - name: Build macOS packages
        shell: bash
        run: velo build -platform darwin -version "${VERSION}"

      - name: Remove temporary signing files
        if: always()
        shell: bash
        run: |
          rm -f .env
          rm -f "${RUNNER_TEMP}/threadnote-certificate.p12"
          rm -f "${RUNNER_TEMP}/threadnote-notary-key.p8"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows
    needs: test
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.test.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Install build tools
        shell: pwsh
        run: |
          go install "github.com/tc-hib/go-winres@v0.3.3"
          # velo v1.0.1 imports Unix-only process APIs from an untagged Go file.
          $velo_source = Join-Path $env:RUNNER_TEMP "velo-${env:VELO_VERSION}"
          $velo_patch = Join-Path $env:RUNNER_TEMP "velo-v1.0.1-windows.patch"
          $patch_source = Join-Path $PWD ".github/patches/velo-v1.0.1-windows.patch"
          $patch_content = [IO.File]::ReadAllText($patch_source).Replace("`r`n", "`n")
          [IO.File]::WriteAllText($velo_patch, $patch_content, [Text.UTF8Encoding]::new($false))
          git -c core.autocrlf=false clone --branch $env:VELO_VERSION --depth 1 https://github.com/ltaoo/velo.git $velo_source
          git -C $velo_source apply --whitespace=error-all $velo_patch
          Push-Location $velo_source
          try {
            go install -ldflags "-X main.version=${env:VELO_VERSION}" ./cmd/velo
          } finally {
            Pop-Location
          }

      - name: Install WebView2 SDK
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "webview2.zip"
          $sdk = Join-Path $env:RUNNER_TEMP "webview2-sdk"
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/${env:WEBVIEW2_VERSION}" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $sdk -Force
          Copy-Item -Path (Join-Path $sdk "build\native\include\*") -Destination "C:\msys64\mingw64\include" -Recurse -Force

      - name: Set application version and build
        shell: pwsh
        run: |
          $env:PATH = "$(go env GOPATH)\bin;C:\msys64\mingw64\bin;$env:PATH"
          $config = Get-Content velo.json -Raw | ConvertFrom-Json
          $config.app.version = $env:VERSION
          $config | ConvertTo-Json -Depth 20 | Set-Content velo.json -Encoding utf8
          velo build -platform windows -version $env:VERSION

      - name: Package Windows application
        shell: pwsh
        run: |
          $sdk = Join-Path $env:RUNNER_TEMP "webview2-sdk"
          $stage = Join-Path $env:RUNNER_TEMP "ThreadNote-windows-amd64"
          $release = Join-Path $PWD "release"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          New-Item -ItemType Directory -Path $release -Force | Out-Null
          Copy-Item "dist\${env:APP_NAME}_windows_amd64\${env:APP_NAME}.exe" $stage
          Copy-Item (Join-Path $sdk "build\native\x64\WebView2Loader.dll") $stage
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath (Join-Path $release "${env:APP_NAME}_${env:VERSION}_windows_amd64.zip") -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs:
      - macos
      - windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum * > checksums.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          prerelease=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            prerelease+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --generate-notes \
            --title "${APP_NAME} ${GITHUB_REF_NAME}" \
            "${prerelease[@]}" \
            release-assets/*
