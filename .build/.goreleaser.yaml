# Auto-generated from app-config.json
version: 2

project_name: myapp

before:
  hooks:
    - go mod tidy

builds:
  - id: windows
    env:
      - CGO_ENABLED=1
    goos:
      - windows
    goarch:
      - amd64
    main: .
    binary: MyApp
    ldflags:
      - -s -w
      - -X main.Mode=release
      - -H windowsgui

  - id: linux
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    main: .
    binary: MyApp
    ldflags:
      - -s -w
      - -X main.Mode=release

  - id: macos
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    main: .
    binary: MyApp
    ldflags:
      - -s -w
      - -X main.Mode=release
    hooks:
      post:
        - rcodesign sign --p12-file {{ .Env.MAC_CERT_P12_FILE }} --p12-password {{ .Env.MAC_CERT_PASSWORD }} --code-signature-flags runtime --entitlements-xml-path {{ .Env.MAC_ENTITLEMENTS_PATH }} "{{ .Path }}"

archives:
  - id: default
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
    format_overrides:
      - goos: windows
        format: zip
      - goos: darwin
        format: binary

upx:
  - enabled: true
    ids:
      - linux
    compress: best
    lzma: true

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  draft: true
  footer: >-
    Built with Velo
  extra_files:
    - glob: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
