<!DOCTYPE html>

        "@/": "/src/"
      }
    }
  </script>
  <script>
    !function () {
      try {
        var root = document.documentElement;
        var key = "data-theme";
        var saved = localStorage.getItem("theme");
        if (saved === "system" || (!saved && true)) {
          var media = window.matchMedia("(prefers-color-scheme: dark)");
          var theme = media.media !== "(prefers-color-scheme: dark)" || media.matches ? "dark" : "light";
          root.style.colorScheme = theme;
          root.setAttribute(key, theme);
        } else if (saved) {
          root.style.colorScheme = saved;
          root.setAttribute(key, saved);
        }
      } catch (_) { }
    }();
  </script>
  <link rel="stylesheet" href="/src/style.css" />
  <link rel="stylesheet" href="/public/highlight-dark.css" />
  <script src="/public/tailwindcss.3.4.17.js"></script>

  <script src="/public/timeless/0.31.4/timeless.web.umd.min.js"></script>

  </script>
</head>

</body>
